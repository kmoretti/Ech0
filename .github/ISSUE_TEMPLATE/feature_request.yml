name: 功能建议
description: 提议新的功能或现有体验改进。
title: "[功能建议] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        请尽量说明真实使用场景和需要解决的问题。开放性想法可先在 Discussions 中交流，需求明确后再创建 Issue。

  - type: textarea
    id: problem
    attributes:
      label: 使用场景与问题
      description: 目前遇到了什么限制，这项功能会帮助谁？
      placeholder: 在使用……时，目前无法……
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述你期望的功能、交互或配置方式，可附截图和参考链接。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 其他方案
      description: 你是否尝试或考虑过其他解决方式？

  - type: dropdown
    id: area
    attributes:
      label: 涉及范围
      multiple: true
      options:
        - 后端 / API
        - 前端 / 界面
        - 登录 / 权限
        - 本地存储 / S3
        - 说说 / 评论
        - Hub / Connect
        - 数据迁移 / 备份
        - Docker / GitHub Actions
        - 文档
        - 其他
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 可提供相关 Issue、截图、草图或其他项目的实现参考。

  - type: checkboxes
    id: confirm
    attributes:
      label: 提交确认
      options:
        - label: 我已搜索现有 Issue 和 Discussions，确认没有重复建议。
          required: true
        - label: 我愿意在实现前继续讨论需求范围和取舍。
          required: false
        - label: 我愿意尝试自行实现该功能。
          required: false
