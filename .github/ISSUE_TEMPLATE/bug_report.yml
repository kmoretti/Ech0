name: Bug 反馈
description: 反馈可稳定复现的后端、前端或部署问题。
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请尽量提供完整、可复现的信息，以便快速定位问题。

        提交前请先搜索现有 Issue，避免重复提交。安全漏洞请勿公开反馈，请通过仓库的私密漏洞报告功能提交。

  - type: textarea
    id: summary
    attributes:
      label: 问题描述
      description: 简要说明发生了什么，以及你认为正确的表现是什么。
      placeholder: 执行某项操作后出现了……，预期应该……
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请按顺序提供最少且完整的复现步骤，必要时附上请求或测试数据。
      placeholder: |
        1. 启动服务
        2. 打开某个页面
        3. 执行某项操作
        4. 出现错误
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期表现
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际表现
      description: 可附上错误信息、控制台堆栈或截图。
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 版本信息
      description: 请填写 Docker 镜像标签、提交哈希或 `ech0 version` 输出。
      placeholder: latest / v1.0.0 / commit abcdef0
    validations:
      required: true

  - type: dropdown
    id: deployment
    attributes:
      label: 部署方式
      options:
        - Docker
        - Docker Compose
        - 本地源码运行
        - 自行构建二进制文件
        - 其他
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 问题范围
      multiple: true
      options:
        - 后端 / API
        - 前端 / 界面
        - 登录 / 权限
        - 本地存储 / S3
        - 说说 / 评论
        - Hub / Connect
        - 数据迁移 / 备份
        - Docker / GitHub Actions
        - 文档
        - 其他
    validations:
      required: true

  - type: input
    id: env
    attributes:
      label: 运行环境
      description: 操作系统、浏览器，以及源码构建时使用的 Go、Node.js 版本。
      placeholder: Windows 11 / Chrome / Go 1.26.0 / Node.js 25

  - type: textarea
    id: logs
    attributes:
      label: 相关日志或配置
      description: 请隐藏 JWT、S3 密钥、访问令牌及其他敏感信息。
      render: shell

  - type: checkboxes
    id: confirm
    attributes:
      label: 提交确认
      options:
        - label: 我已搜索现有 Issue，确认这不是重复问题。
          required: true
        - label: 我已隐藏日志和配置中的密钥及个人信息。
          required: true
