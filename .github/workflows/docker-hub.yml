name: 构建并推送 Docker Hub 镜像

"on":
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      image_tag:
        description: "可选镜像标签；留空时使用分支名或 Git 标签"
        required: false
        type: string
      push_latest:
        description: "是否同时推送 latest 标签"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: docker-hub-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  IMAGE_NAME: ech0
  NODE_VERSION: "25"
  PNPM_VERSION: "11"
  GO_VERSION: "1.26.4"
  ZIG_VERSION: "latest"

jobs:
  build-backend:
    name: 构建后端 linux/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch:
          - amd64
          - arm64

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 配置 pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 配置 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: 构建前端
        working-directory: ./web
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm build --mode production

      - name: 检查前端产物
        run: |
          set -euo pipefail
          test -d template/dist
          test -n "$(ls -A template/dist)"

      - name: 配置 Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: "**/go.sum"

      - name: 配置 Go 代理
        run: go env -w GOPROXY=https://proxy.golang.org,direct

      - name: 为 ARM64 配置 Zig
        if: matrix.goarch == 'arm64'
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: 构建后端二进制文件
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "1"
        run: |
          set -euo pipefail

          GIT_COMMIT="$(git rev-parse --short HEAD 2>/dev/null || echo unknown)"
          BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          VERSION_PKG="github.com/lin-snow/ech0/internal/version"
          STATIC_LDFLAGS="-linkmode external -extldflags '-static' -X ${VERSION_PKG}.Commit=${GIT_COMMIT} -X ${VERSION_PKG}.BuildTime=${BUILD_TIME}"
          OUTPUT_NAME="ech0-linux-${GOARCH}"

          if [ "${GOARCH}" = "arm64" ]; then
            export CC="zig cc -target aarch64-linux-musl"
            export CXX="zig c++ -target aarch64-linux-musl"

            SQLITE_INC="${RUNNER_TEMP}/sqlite-include"
            mkdir -p "${SQLITE_INC}"
            go mod download github.com/mattn/go-sqlite3
            MATTN_DIR="$(go list -m -f '{{.Dir}}' github.com/mattn/go-sqlite3)"
            if [ -z "${MATTN_DIR}" ] || [ ! -f "${MATTN_DIR}/sqlite3-binding.h" ]; then
              echo "::error::could not locate go-sqlite3 header"
              exit 1
            fi
            cp "${MATTN_DIR}/sqlite3-binding.h" "${SQLITE_INC}/sqlite3.h"
            export CGO_CFLAGS="-I${SQLITE_INC} -Du_int8_t=uint8_t -Du_int16_t=uint16_t -Du_int64_t=uint64_t -Wno-typedef-redefinition -fno-sanitize=undefined"
          else
            export CC="gcc"
          fi

          go build -tags netgo -ldflags "${STATIC_LDFLAGS}" -o "${OUTPUT_NAME}" ./cmd/ech0/main.go
          chmod +x "${OUTPUT_NAME}"

      - name: 上传后端构建产物
        uses: actions/upload-artifact@v7
        with:
          name: ech0-linux-${{ matrix.goarch }}-asset
          path: ech0-linux-${{ matrix.goarch }}
          retention-days: 1

  build-and-push:
    name: 构建并推送 Docker 镜像
    runs-on: ubuntu-latest
    needs:
      - build-backend

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 下载后端构建产物
        uses: actions/download-artifact@v8
        with:
          pattern: ech0-linux-*-asset
          path: ./backend-artifacts
          merge-multiple: true

      - name: 生成 Docker 标签
        id: meta
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          INPUT_IMAGE_TAG: ${{ inputs.image_tag }}
          INPUT_PUSH_LATEST: ${{ inputs.push_latest }}
        run: |
          set -euo pipefail

          if [ -z "${DOCKERHUB_USERNAME}" ]; then
            echo "::error::Repository secret DOCKERHUB_USERNAME is required."
            exit 1
          fi

          IMAGE="docker.io/${DOCKERHUB_USERNAME}/${IMAGE_NAME}"

          if [ -n "${INPUT_IMAGE_TAG}" ]; then
            TAG="${INPUT_IMAGE_TAG}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="${GITHUB_REF_NAME//\//-}"
          fi

          {
            echo "image=${IMAGE}"
            echo "tag=${TAG}"
            echo "tags<<EOF"
            echo "${IMAGE}:${TAG}"
            if [ "${GITHUB_EVENT_NAME}" = "release" ] || [ "${INPUT_PUSH_LATEST}" = "true" ]; then
              echo "${IMAGE}:latest"
            fi
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: 登录 Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 配置 QEMU
        uses: docker/setup-qemu-action@v4

      - name: 配置 Buildx
        uses: docker/setup-buildx-action@v4

      - name: 构建并推送镜像
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: 输出构建摘要
        run: |
          echo "### Docker Hub 镜像" >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "- 镜像：\`${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}\`" >> "${GITHUB_STEP_SUMMARY}"
          echo "- 拉取：\`docker pull ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}\`" >> "${GITHUB_STEP_SUMMARY}"
