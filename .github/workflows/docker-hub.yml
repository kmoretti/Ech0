name: Release and Docker

"on":
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 5.7.0 or v5.7.0"
        required: true
        type: string
      push_latest:
        description: "Also publish the Docker latest tag"
        required: true
        default: true
        type: boolean
  push:
    tags:
      - "v*"

run-name: Release ${{ inputs.version || github.ref_name }}

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  GO_VERSION: "1.27.0"
  NODE_VERSION: "26"
  PNPM_VERSION: "11.9.0"
  ZIG_VERSION: "latest"
  IMAGE_NAME: ech0

jobs:
  prepare:
    name: Validate release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      push_latest: ${{ steps.version.outputs.push_latest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve and validate version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PUSH_LATEST: ${{ inputs.push_latest }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            VERSION="${INPUT_VERSION#v}"
            PUSH_LATEST="${INPUT_PUSH_LATEST:-true}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
            PUSH_LATEST=true
          fi
          if ! printf '%s' "${VERSION}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Invalid version '${VERSION}'. Expected X.Y.Z or X.Y.Z-prerelease."
            exit 1
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "push_latest=${PUSH_LATEST}" >> "${GITHUB_OUTPUT}"

  frontend:
    name: Build frontend
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install dependencies and build frontend
        working-directory: web
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm run build
      - name: Verify embedded frontend
        run: test -d template/dist && test -n "$(find template/dist -type f -print -quit)"
      - name: Upload frontend
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: template/dist
          retention-days: 1

  backend:
    name: Build linux/${{ matrix.goarch }}
    needs: [prepare, frontend]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download frontend
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: template/dist
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum
      - name: Setup Zig
        if: matrix.goarch == 'arm64'
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Build static binary
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "1"
        run: |
          set -euo pipefail
          GIT_COMMIT="$(git rev-parse --short HEAD)"
          BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          RELEASE_VERSION="${{ needs.prepare.outputs.version }}"
          LDFLAGS="-linkmode external -extldflags '-static' -X github.com/lin-snow/ech0/internal/version.Version=${RELEASE_VERSION} -X github.com/lin-snow/ech0/internal/version.Commit=${GIT_COMMIT} -X github.com/lin-snow/ech0/internal/version.BuildTime=${BUILD_TIME}"
          if [ "${GOARCH}" = "arm64" ]; then
            export CC="zig cc -target aarch64-linux-musl"
            export CXX="zig c++ -target aarch64-linux-musl"
            SQLITE_INC="${RUNNER_TEMP}/sqlite-include"
            mkdir -p "${SQLITE_INC}"
            go mod download github.com/mattn/go-sqlite3
            MATTN_DIR="$(go list -m -f '{{.Dir}}' github.com/mattn/go-sqlite3)"
            test -f "${MATTN_DIR}/sqlite3-binding.h"
            cp "${MATTN_DIR}/sqlite3-binding.h" "${SQLITE_INC}/sqlite3.h"
            export CGO_CFLAGS="-I${SQLITE_INC} -Du_int8_t=uint8_t -Du_int16_t=uint16_t -Du_int64_t=uint64_t -Wno-typedef-redefinition -fno-sanitize=undefined"
          else
            export CC=gcc
          fi
          go build -tags netgo -ldflags "${LDFLAGS}" -o "ech0-linux-${GOARCH}" ./cmd/ech0/main.go
          chmod +x "ech0-linux-${GOARCH}"
      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: ech0-linux-${{ matrix.goarch }}
          path: ech0-linux-${{ matrix.goarch }}
          retention-days: 1

  release:
    name: Publish GitHub Release
    needs: [prepare, backend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          pattern: ech0-linux-*
          path: release-assets
          merge-multiple: true
      - name: Package binaries and checksums
        working-directory: release-assets
        run: |
          set -euo pipefail
          for binary in ech0-linux-*; do
            tar -czf "${binary}.tar.gz" "${binary}"
          done
          sha256sum *.tar.gz > SHA256SUMS
      - name: Create or update release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Ech0 ${{ needs.prepare.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ contains(needs.prepare.outputs.version, '-') }}
          files: |
            release-assets/*.tar.gz
            release-assets/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Build and push Docker image
    needs: [prepare, backend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download backend binaries
        uses: actions/download-artifact@v8
        with:
          pattern: ech0-linux-*
          path: backend-artifacts
          merge-multiple: true
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4
      - name: Resolve image tags
        id: image
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          PUSH_LATEST: ${{ needs.prepare.outputs.push_latest }}
        run: |
          set -euo pipefail
          if [ -z "${DOCKERHUB_USERNAME}" ]; then
            echo "::error::Set the DOCKERHUB_USERNAME repository variable or secret."
            exit 1
          fi
          if [ -z "${DOCKERHUB_TOKEN:-}" ]; then
            echo "::error::Set the DOCKERHUB_TOKEN repository secret."
            exit 1
          fi
          IMAGE="docker.io/${DOCKERHUB_USERNAME}/${IMAGE_NAME}"
          {
            echo "image=${IMAGE}"
            echo "tags<<EOF"
            echo "${IMAGE}:${RELEASE_TAG}"
            if [ "${PUSH_LATEST}" = "true" ]; then
              echo "${IMAGE}:latest"
            fi
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"
      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
